[package]
name = "mnm-cartographer"
version = "0.0.6"
edition = "2021"
description = "Zone maps for Monsters & Memories"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"
unity-rs-core = "0.5.2"
webp = "0.3"
rayon = "1"
# Updating itself; see src/update.rs. rustls rather than the system TLS so the
# binary still links nothing it does not carry.
ureq = { version = "2", default-features = false, features = ["tls"] }
sha2 = "0.11"
minisign-verify = "0.3"
self-replace = "1.5"
# Unpacking a release: .zip on Windows, .tar.gz on Linux. Both are built
# everywhere, so either can be tested anywhere; zip and flate2 are linked in
# already by other crates.
zip = { version = "8", default-features = false, features = ["deflate"] }
flate2 = "1"
tar = "0.4"
global-hotkey = "0.8.0"

# Native folder picker, per platform. On Linux the xdg-portal backend keeps GTK
# out of the link, so the binary still needs no system toolkit; on Windows the
# default (Win32) backend is the one that exists. Declaring the Linux-only
# feature set for every target leaves Windows with no backend at all, and the
# crate then resolves to nothing.
[target.'cfg(unix)'.dependencies]
libc = "0.2"   # only to restore the default SIGPIPE handler; see main()
rfd = { version = "0.15", default-features = false, features = ["xdg-portal", "async-std"] }

[target.'cfg(windows)'.dependencies]
rfd = "0.15"


[profile.release]
opt-level = "z"      # optimise for size, not speed: the UI is not hot
lto = true
codegen-units = 1
panic = "abort"
strip = true

# Builds for a tester to try: fast enough to feel like the real thing, but with
# panics, backtraces and symbols left intact so a crash can be reported. The
# debug-assertions flag is also what keeps the Windows console window -- main.rs
# only sets windows_subsystem = "windows" when assertions are off -- so a tester
# sees any error text instead of the process vanishing.
[profile.winbuild]
inherits = "release"
opt-level = 2
lto = false
codegen-units = 16
panic = "unwind"
strip = false
debug = 1
debug-assertions = true
