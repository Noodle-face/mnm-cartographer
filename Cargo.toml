[package]
name = "mnm-cartographer"
version = "0.1.0"
edition = "2021"
description = "Zone maps for Monsters & Memories"
license = "MIT"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
egui = "0.29"
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["webp", "png"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
dirs = "5"
anyhow = "1"

[profile.release]
opt-level = "z"      # optimise for size, not speed: the UI is not hot
lto = true
codegen-units = 1
panic = "abort"
strip = true
